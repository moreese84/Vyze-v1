name: Vyze CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  build:
    name: Debug Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vyze-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release-r8:
    # P3 #94: release runs R8 (minify + shrink) but CI never exercised
    # it - every R8 failure was release-only. minifyReleaseWithR8 needs
    # no keystore (signing is a later task), so the rules, missing
    # classes, and full-mode renames are all validated on every push.
    name: Release R8 Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run release R8 (no signing)
        run: ./gradlew :app:minifyReleaseWithR8 --no-daemon

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

  offline-contract:
    name: Offline Contract Guard
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The debug-only transcript exporter must NEVER reach the release
      # manifest (src/debug source-set isolation — see
      # docs/eval/OFFLINE_GUARANTEE.md, Layer 2).
      - name: Release manifest excludes the debug-only exporter
        run: |
          ./gradlew :app:processReleaseMainManifest --no-daemon
          MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml \
            -ipath "*release*" -ipath "*process*manifest*" | head -1)
          echo "Merged release manifest: $MANIFEST"
          if grep -q "InteractionLogExportReceiver" "$MANIFEST"; then
            echo "::error::Debug-only exporter leaked into the release manifest"
            exit 1
          fi
          echo "OK: no debug-only components in the release manifest"

      # The genai-prompt exclusion (dead ADK transitive dragging Google's
      # transport telemetry) must stay in effect in build.gradle.kts.
      - name: Dead genai-prompt exclusion holds
        run: |
          if ./gradlew :app:dependencies --configuration releaseRuntimeClasspath \
              --no-daemon | grep -q "com.google.mlkit:genai-prompt"; then
            echo "::error::genai-prompt returned to the release classpath"
            exit 1
          fi
          echo "OK: genai-prompt stays excluded"

      # Informational: the merged release manifest still carries one
      # INTERNET declaration from ML Kit's transport library (Vyze's own
      # code performs zero network communication). If this ever rises or
      # the source changes, update docs/eval/OFFLINE_GUARANTEE.md.
      - name: Report library-declared INTERNET (informational)
        run: |
          MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml \
            -ipath "*release*" -ipath "*process*manifest*" | head -1)
          count=$(grep -c "android.permission.INTERNET" "$MANIFEST" || true)
          echo "Release manifest INTERNET declarations: $count"
          echo "(expected >=1 from ML Kit transport — see docs/eval/OFFLINE_GUARANTEE.md)"
